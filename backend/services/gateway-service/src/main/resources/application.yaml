# 所有 TODO_* 均为部署时必须通过环境变量填写的项目；不得在仓库中放入真实凭据。
server:
  port: ${SERVER_PORT:8080} # TODO: 生产环境网关监听端口

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos} # TODO: Nacos 用户名
      password: ${NACOS_PASSWORD:nacos} # TODO: Nacos 密码
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848} # TODO: Nacos 地址
        namespace: ${NACOS_NAMESPACE:local} # TODO: local/dev/prod 对应 namespace ID
        group: ${NACOS_GROUP:DEFAULT_GROUP} # TODO: 服务分组
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858} # TODO: Sentinel Dashboard 地址
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
