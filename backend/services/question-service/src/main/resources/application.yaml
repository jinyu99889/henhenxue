# 所有 TODO_* 均为部署时必须通过环境变量填写的项目；不得在仓库中放入真实凭据。
server:
  port: ${SERVER_PORT:8084} # TODO: question-service 端口
spring:
  application.name: question-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hengxue_question?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC} # TODO: 服务私有数据库
    username: ${DB_USERNAME:root} # TODO: 数据库账号
    password: ${DB_PASSWORD:} # TODO: 数据库密码
  cloud.nacos:
    username: ${NACOS_USERNAME:nacos} # TODO: Nacos 用户名
    password: ${NACOS_PASSWORD:nacos} # TODO: Nacos 密码
    discovery:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848} # TODO: Nacos 地址
      namespace: ${NACOS_NAMESPACE:local} # TODO: namespace ID
      group: ${NACOS_GROUP:DEFAULT_GROUP}
  config.import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
dubbo:
  application.name: ${spring.application.name}
  registry.address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}?namespace=${NACOS_NAMESPACE:local} # TODO: 注册中心
  protocol:
    name: tri
    port: ${DUBBO_PORT:20884} # TODO: Dubbo 端口
hengxue:
  mineru:
    max-archive-size: ${MINERU_MAX_ARCHIVE_SIZE:30MB} # TODO: 如需调整，保持文档约束内
    max-extracted-size: ${MINERU_MAX_EXTRACTED_SIZE:100MB} # TODO: 如需调整，保持文档约束内
    max-file-count: ${MINERU_MAX_FILE_COUNT:500} # TODO: 如需调整，保持文档约束内
management.endpoints.web.exposure.include: health,info,prometheus
