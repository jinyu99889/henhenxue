# 所有 TODO_* 均为部署时必须通过环境变量填写的项目；不得在仓库中放入真实凭据。
server:
  port: ${SERVER_PORT:8086} # TODO: ai-service 端口
spring:
  application.name: ai-service
  main.web-application-type: reactive
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hengxue_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC} # TODO: 服务私有数据库
    username: ${DB_USERNAME:root} # TODO: 数据库账号
    password: ${DB_PASSWORD:} # TODO: 数据库密码
  cloud.nacos:
    username: ${NACOS_USERNAME:nacos} # TODO: Nacos 用户名
    password: ${NACOS_PASSWORD:nacos} # TODO: Nacos 密码
    discovery:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848} # TODO: Nacos 地址
      namespace: ${NACOS_NAMESPACE:local} # TODO: namespace ID
      group: ${NACOS_GROUP:DEFAULT_GROUP}
  config.import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
dubbo:
  application.name: ${spring.application.name}
  registry.address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}?namespace=${NACOS_NAMESPACE:local} # TODO: 注册中心
  protocol:
    name: tri
    port: ${DUBBO_PORT:20886} # TODO: Dubbo 端口
hengxue:
  ai:
    kms-key-id: ${AI_KMS_KEY_ID:} # TODO: 信封加密主密钥标识；业务数据库只能保存密文
    task-max-retries: ${AI_TASK_MAX_RETRIES:2} # TODO: 仅网络超时、429、5xx 可重试
    deepseek-api-key: ${DEEPSEEK_API_KEY:} # TODO: 平台测试凭据可选；用户凭据不得写入此配置
    dashscope-api-key: ${DASHSCOPE_API_KEY:} # TODO: 平台测试凭据可选；用户凭据不得写入此配置
management.endpoints.web.exposure.include: health,info,prometheus
