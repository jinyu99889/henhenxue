openapi: 3.1.0
info:
  title: 狠狠学 HTTP API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    第一期开工前的规范性 HTTP 契约。所有响应使用 ApiResponse 包装；
    字段约束、业务状态机和补充示例见 03-api-specification.md。
servers:
  - url: /api/v1
security:
  - SaToken: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register
      operationId: register
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/RegisterRequest'}
      responses: {'201': {$ref: '#/components/responses/User'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /auth/login:
    post:
      security: []
      summary: Login
      operationId: login
      requestBody: {$ref: '#/components/requestBodies/LoginRequest'}
      responses: {'200': {$ref: '#/components/responses/Login'}, '401': {$ref: '#/components/responses/Error'}}
  /auth/email-codes:
    post:
      security: []
      summary: Send email code
      operationId: sendEmailCode
      requestBody: {$ref: '#/components/requestBodies/EmailCodeRequest'}
      responses: {'202': {$ref: '#/components/responses/Empty'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /auth/password-resets:
    post:
      security: []
      summary: Reset password
      operationId: resetPassword
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PasswordResetRequest'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /auth/password-changes:
    post:
      summary: Change password
      operationId: changePassword
      requestBody: {$ref: '#/components/requestBodies/PasswordChangeRequest'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post:
      summary: Logout
      operationId: logout
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /auth/refresh:
    post:
      summary: Refresh session
      operationId: refreshSession
      responses: {'200': {$ref: '#/components/responses/Login'}, '401': {$ref: '#/components/responses/Error'}}
  /users/me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      responses: {'200': {$ref: '#/components/responses/User'}, '401': {$ref: '#/components/responses/Error'}}
    patch:
      summary: Patch current user
      operationId: patchCurrentUser
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UserPatchRequest'}
      responses: {'200': {$ref: '#/components/responses/User'}, '409': {$ref: '#/components/responses/Error'}}
  /ai-credentials:
    get:
      summary: List AI credentials
      operationId: listAiCredentials
      responses: {'200': {$ref: '#/components/responses/CredentialList'}, '400': {$ref: '#/components/responses/Error'}}
    post:
      summary: Create AI credential
      operationId: createAiCredential
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CredentialUpsertRequest'}
      responses: {'201': {$ref: '#/components/responses/Credential'}, '422': {$ref: '#/components/responses/Error'}}
  /ai-credentials/{credentialId}:
    parameters: [{$ref: '#/components/parameters/CredentialId'}]
    patch:
      summary: Patch AI credential
      operationId: patchAiCredential
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CredentialUpsertRequest'}
      responses: {'200': {$ref: '#/components/responses/Credential'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Revoke AI credential
      operationId: revokeAiCredential
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Error'}}
  /articles:
    get:
      security: []
      summary: List articles
      operationId: listArticles
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Keyword'}, {$ref: '#/components/parameters/CategorySlug'}, {$ref: '#/components/parameters/TagSlug'}, {$ref: '#/components/parameters/ArticleSort'}]
      responses: {'200': {$ref: '#/components/responses/ArticlePage'}, '400': {$ref: '#/components/responses/Error'}}
  /articles/{slug}:
    get:
      security: []
      summary: Get article
      operationId: getArticle
      parameters: [{$ref: '#/components/parameters/Slug'}]
      responses: {'200': {$ref: '#/components/responses/Article'}, '404': {$ref: '#/components/responses/Error'}}
  /pages/about:
    get:
      security: []
      summary: Get about page
      operationId: getAboutPage
      responses: {'200': {$ref: '#/components/responses/Article'}, '404': {$ref: '#/components/responses/Error'}}
  /categories:
    get:
      security: []
      summary: List categories
      operationId: listCategories
      responses: {'200': {$ref: '#/components/responses/CategoryList'}, '400': {$ref: '#/components/responses/Error'}}
  /tags:
    get:
      security: []
      summary: List tags
      operationId: listTags
      responses: {'200': {$ref: '#/components/responses/TagList'}, '400': {$ref: '#/components/responses/Error'}}
  /archives:
    get:
      security: []
      summary: List archives
      operationId: listArchives
      responses: {'200': {$ref: '#/components/responses/ArchiveList'}, '400': {$ref: '#/components/responses/Error'}}
  /articles/{articleId}/favorite:
    parameters: [{$ref: '#/components/parameters/ArticleId'}]
    post:
      summary: Favorite article
      operationId: favoriteArticle
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Unfavorite article
      operationId: unfavoriteArticle
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/articles:
    post:
      summary: Create article draft
      operationId: createArticleDraft
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ArticleUpsertRequest'}
      responses: {'201': {$ref: '#/components/responses/ArticleAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/articles/{articleId}:
    parameters: [{$ref: '#/components/parameters/ArticleId'}]
    patch:
      summary: Patch article
      operationId: patchArticle
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ArticleUpsertRequest'}
      responses: {'200': {$ref: '#/components/responses/ArticleAdmin'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/articles/{articleId}/publish:
    post:
      summary: Publish article
      operationId: publishArticle
      parameters: [{$ref: '#/components/parameters/ArticleId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ArticlePublishRequest'}
      responses: {'200': {$ref: '#/components/responses/ArticleAdmin'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/articles/{articleId}/offline:
    post:
      summary: Offline article
      operationId: offlineArticle
      parameters: [{$ref: '#/components/parameters/ArticleId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ArticleAdmin'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/articles/{articleId}/revisions:
    get:
      summary: List article revisions
      operationId: listArticleRevisions
      parameters: [{$ref: '#/components/parameters/ArticleId'}]
      responses: {'200': {$ref: '#/components/responses/RevisionList'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/articles/{articleId}/revisions/{revisionId}/restore:
    post:
      summary: Restore article revision
      operationId: restoreArticleRevision
      parameters: [{$ref: '#/components/parameters/ArticleId'}, {$ref: '#/components/parameters/RevisionId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ArticleAdmin'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/categories:
    post:
      summary: Create category
      operationId: createCategory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CategoryUpsertRequest'}
      responses: {'201': {$ref: '#/components/responses/CategoryAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/categories/{categoryId}:
    patch:
      summary: Patch category
      operationId: patchCategory
      parameters: [{$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/CategoryUpsertRequest'}
      responses: {'200': {$ref: '#/components/responses/CategoryAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/categories/{categoryId}/archive:
    post:
      summary: Archive category
      operationId: archiveCategory
      parameters: [{$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/CategoryAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/tags:
    post:
      summary: Create tag
      operationId: createTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/TagUpsertRequest'}
      responses: {'201': {$ref: '#/components/responses/TagAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/tags/{tagId}:
    patch:
      summary: Patch tag
      operationId: patchTag
      parameters: [{$ref: '#/components/parameters/TagId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/TagUpsertRequest'}
      responses: {'200': {$ref: '#/components/responses/TagAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /admin/tags/{tagId}/archive:
    post:
      summary: Archive tag
      operationId: archiveTag
      parameters: [{$ref: '#/components/parameters/TagId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/TagAdmin'}, '400': {$ref: '#/components/responses/Error'}}
  /files/upload-credentials:
    post:
      summary: Create upload credential
      operationId: createUploadCredential
      requestBody: {$ref: '#/components/requestBodies/UploadCredentialRequest'}
      responses: {'201': {$ref: '#/components/responses/UploadCredential'}, '400': {$ref: '#/components/responses/Error'}}
  /files/{fileId}/complete:
    post:
      summary: Complete upload
      operationId: completeUpload
      parameters: [{$ref: '#/components/parameters/FileId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/FileObject'}, '422': {$ref: '#/components/responses/Error'}}
  /files/{fileId}/download-url:
    get:
      summary: Get download url
      operationId: getDownloadUrl
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses: {'200': {$ref: '#/components/responses/DownloadUrl'}, '404': {$ref: '#/components/responses/Error'}}
  /tasks/{taskId}:
    get:
      summary: Get task
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses: {'200': {$ref: '#/components/responses/Task'}, '404': {$ref: '#/components/responses/Error'}}
  /learning/trees:
    get:
      summary: List trees
      operationId: listTrees
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/TreePage'}, '400': {$ref: '#/components/responses/Error'}}
    post:
      summary: Create tree
      operationId: createTree
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateTreeRequest'}
      responses: {'202': {$ref: '#/components/responses/TaskAccepted'}, '400': {$ref: '#/components/responses/Error'}}
  /learning/trees/{treeId}:
    get:
      summary: Get tree
      operationId: getTree
      parameters: [{$ref: '#/components/parameters/TreeId'}]
      responses: {'200': {$ref: '#/components/responses/Tree'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /learning/trees/{treeId}/credential:
    patch:
      summary: Patch tree credential
      operationId: patchTreeCredential
      parameters: [{$ref: '#/components/parameters/TreeId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/TreeCredentialRequest'}
      responses: {'200': {$ref: '#/components/responses/Tree'}, '409': {$ref: '#/components/responses/Error'}}
  /learning/trees/{treeId}/nodes/{nodeKey}/content:
    get:
      summary: Get tree node content
      operationId: getTreeNodeContent
      parameters: [{$ref: '#/components/parameters/TreeId'}, {$ref: '#/components/parameters/NodeKey'}]
      responses: {'200': {$ref: '#/components/responses/NodeContent'}, '400': {$ref: '#/components/responses/Error'}}
  /learning/trees/{treeId}/follow-ups:
    post:
      summary: Create follow up
      operationId: createFollowUp
      parameters: [{$ref: '#/components/parameters/TreeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/FollowUpRequest'}
      responses: {'202': {$ref: '#/components/responses/FollowUpAccepted'}, '422': {$ref: '#/components/responses/Error'}}
  /learning/trees/{treeId}/conversations:
    get:
      summary: List node conversations
      operationId: listNodeConversations
      parameters: [{$ref: '#/components/parameters/TreeId'}, {$ref: '#/components/parameters/NodeKeyQuery'}]
      responses: {'200': {$ref: '#/components/responses/ConversationList'}, '400': {$ref: '#/components/responses/Error'}}
  /learning/conversations/{conversationId}/messages:
    get:
      summary: List conversation messages
      operationId: listConversationMessages
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/MessagePage'}, '400': {$ref: '#/components/responses/Error'}}
  /question-libraries:
    get:
      summary: List question libraries
      operationId: listQuestionLibraries
      responses: {'200': {$ref: '#/components/responses/LibraryList'}, '400': {$ref: '#/components/responses/Error'}}
    post:
      summary: Create question library
      operationId: createQuestionLibrary
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/LibraryCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/Library'}, '400': {$ref: '#/components/responses/Error'}}
  /question-libraries/{libraryId}:
    patch:
      summary: Patch question library
      operationId: patchQuestionLibrary
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/LibraryPatchRequest'}
      responses: {'200': {$ref: '#/components/responses/Library'}, '400': {$ref: '#/components/responses/Error'}}
  /question-libraries/{libraryId}/imports:
    post:
      summary: Create question import
      operationId: createQuestionImport
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/QuestionImportRequest'}
      responses: {'202': {$ref: '#/components/responses/TaskAccepted'}, '400': {$ref: '#/components/responses/Error'}}
  /question-imports/{importId}:
    get:
      summary: Get question import
      operationId: getQuestionImport
      parameters: [{$ref: '#/components/parameters/ImportId'}]
      responses: {'200': {$ref: '#/components/responses/QuestionImport'}, '400': {$ref: '#/components/responses/Error'}}
  /question-libraries/{libraryId}/questions:
    get:
      summary: List library questions
      operationId: listLibraryQuestions
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/QuestionPage'}, '400': {$ref: '#/components/responses/Error'}}
    post:
      summary: Create question
      operationId: createQuestion
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/QuestionUpsertRequest'}
      responses: {'201': {$ref: '#/components/responses/Question'}, '400': {$ref: '#/components/responses/Error'}}
  /questions/{questionId}:
    patch:
      summary: Patch question
      operationId: patchQuestion
      parameters: [{$ref: '#/components/parameters/QuestionId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/QuestionUpsertRequest'}
      responses: {'200': {$ref: '#/components/responses/Question'}, '400': {$ref: '#/components/responses/Error'}}
  /questions/{questionId}/publish:
    post:
      summary: Publish question
      operationId: publishQuestion
      parameters: [{$ref: '#/components/parameters/QuestionId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Question'}, '400': {$ref: '#/components/responses/Error'}}
  /questions/{questionId}/archive:
    post:
      summary: Archive question
      operationId: archiveQuestion
      parameters: [{$ref: '#/components/parameters/QuestionId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Question'}, '400': {$ref: '#/components/responses/Error'}}
  /question-libraries/{libraryId}/questions/{questionId}:
    delete:
      summary: Remove question from library
      operationId: removeQuestionFromLibrary
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/QuestionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /practice-sessions:
    get:
      summary: List practice sessions
      operationId: listPracticeSessions
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/PracticePage'}, '400': {$ref: '#/components/responses/Error'}}
    post:
      summary: Create practice session
      operationId: createPracticeSession
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PracticeCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/Practice'}, '400': {$ref: '#/components/responses/Error'}}
  /practice-sessions/{sessionId}:
    get:
      summary: Get practice session
      operationId: getPracticeSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/Practice'}, '400': {$ref: '#/components/responses/Error'}}
  /practice-sessions/{sessionId}/next:
    get:
      summary: Get next practice question
      operationId: getNextPracticeQuestion
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/PracticeQuestion'}, '404': {$ref: '#/components/responses/Error'}}
  /practice-sessions/{sessionId}/answers:
    post:
      summary: Submit practice answer
      operationId: submitPracticeAnswer
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PracticeAnswerRequest'}
      responses: {'200': {$ref: '#/components/responses/PracticeAnswer'}, '400': {$ref: '#/components/responses/Error'}}
  /practice-sessions/{sessionId}/finish:
    post:
      summary: Finish practice session
      operationId: finishPracticeSession
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Practice'}, '400': {$ref: '#/components/responses/Error'}}
  /practice-statistics:
    get:
      summary: Get practice statistics
      operationId: getPracticeStatistics
      responses: {'200': {$ref: '#/components/responses/Statistics'}, '400': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    SaToken: {type: apiKey, in: header, name: satoken}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Keyword: {name: keyword, in: query, schema: {type: string, maxLength: 128}}
    CategorySlug: {name: categorySlug, in: query, schema: {$ref: '#/components/schemas/Slug'}}
    TagSlug: {name: tagSlug, in: query, schema: {$ref: '#/components/schemas/Slug'}}
    ArticleSort: {name: sort, in: query, schema: {type: string, enum: [RELEVANCE, PUBLISHED_AT], default: PUBLISHED_AT}}
    Slug: {name: slug, in: path, required: true, schema: {$ref: '#/components/schemas/Slug'}}
    CredentialId: {name: credentialId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ArticleId: {name: articleId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    CategoryId: {name: categoryId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    TagId: {name: tagId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    RevisionId: {name: revisionId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    FileId: {name: fileId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    TaskId: {name: taskId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    TreeId: {name: treeId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    NodeKey: {name: nodeKey, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    NodeKeyQuery: {name: nodeKey, in: query, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ConversationId: {name: conversationId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    LibraryId: {name: libraryId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ImportId: {name: importId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    QuestionId: {name: questionId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    SessionId: {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
  requestBodies:
    RegisterRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
    LoginRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    EmailCodeRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailCodeRequest'}}}}
    PasswordResetRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}}
    PasswordChangeRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}}
    UserPatchRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserPatchRequest'}}}}
    CredentialUpsertRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialUpsertRequest'}}}}
    ArticleUpsertRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleUpsertRequest'}}}}
    ArticlePublishRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArticlePublishRequest'}}}}
    CategoryUpsertRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryUpsertRequest'}}}}
    TagUpsertRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagUpsertRequest'}}}}
    UploadCredentialRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadCredentialRequest'}}}}
    CreateTreeRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTreeRequest'}}}}
    TreeCredentialRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TreeCredentialRequest'}}}}
